# ── Observation Engine Categories ───────────────────────────────────────
# The 10 operational categories Otto uses internally.
# Users never see category labels — only natural language observations.

observation_categories:
  - id: cognitive_dissonance
    label: "Belief-Action Gap"
    biases: [cognitive_dissonance_reduction]
    tool: contradiction_mirror
    description: "User's current action contradicts a prior stated belief or value"

  - id: attention_blindness
    label: "Hyperfocus Blindness"
    biases: [selective_attention, present_bias]
    tool: drift_detection
    description: "User is locked onto one thing and missing other signals"

  - id: reality_distortion
    label: "Optimism Override"
    biases: [optimism_bias, overconfidence, survivorship_bias]
    tool: open_questions
    description: "User is seeing what they want to see, not what's there"

  - id: people_perception
    label: "People Lens"
    biases: [halo_effect, sunk_cost_people, authority_deference, authority_resistance]
    tool: relationship_timeline
    description: "User's perception of a person is colored by a single trait or history"

  - id: certainty_excess
    label: "Confidence Calibration"
    biases: [overconfidence, anchoring]
    tool: open_questions
    description: "User is more certain than the evidence warrants"

  - id: narrative_lock
    label: "Story vs Data"
    biases: [framing_effects, survivorship_bias, confirmation_bias]
    tool: pattern_reflections
    description: "User is reasoning from narrative, not evidence"

  - id: pace_mismatch
    label: "Speed Check"
    biases: [speed_over_rigor, analysis_paralysis, present_bias]
    tool: drift_detection
    description: "User's pace doesn't match the stakes of the decision"

  - id: relationship_gaps
    label: "Connection Gaps"
    biases: [selective_attention, sunk_cost_people, conflict_avoidance]
    tool: relationship_timeline
    description: "User has neglected a relationship or avoided a necessary conversation"

  - id: evidence_gaps
    label: "Reasoning Gaps"
    biases: [survivorship_bias, social_proof, anchoring]
    tool: open_questions
    description: "User's reasoning has structural gaps they haven't noticed"

  - id: autonomy_tension
    label: "Independence vs Input"
    biases: [isolation_bias, knowledge_hoarding, under_communication, consensus_seeking]
    tool: pattern_reflections
    description: "User is either too isolated or too consensus-driven for the situation"


# ── Mirror Panel Components ─────────────────────────────────────────────
# The four surfaces that make up the behavioral mirror in the Command Center.

mirror_panels:
  open_questions:
    description: "Questions Otto is genuinely curious about, derived from observed patterns"
    refresh: per_session
    max_visible: 5
    source: observation_engine
    display: "natural language questions, no categories, no scores"

  pattern_reflections:
    description: "Ambient observations about working patterns, energy, focus"
    refresh: continuous
    max_visible: 3
    source: session_state + observation_engine
    display: "natural language observations, available when sought, never pushed"

  contradiction_mirror:
    description: "User's own words surfaced when current action contradicts them"
    trigger: contradiction_detected
    source: contradiction_log + session_history
    display: "quoted past statement + current observation + override button"
    override: always_available

  relationship_timeline:
    description: "Timestamps and topics for relationship touchpoints"
    refresh: on_interaction
    source: session_state + communication_log
    display: "timeline view, no health scores, gaps speak for themselves"
