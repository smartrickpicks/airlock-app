# Bias Susceptibility Mapping — DECF Drives → Cognitive Bias Fingerprint
# Each PI profile maps to predicted cognitive biases based on drive configuration.
# Otto's observation engine uses this to know WHERE to look for each user.
#
# Design principles (non-negotiable):
#   - Observations are surfaced as natural language, NEVER scores
#   - Mirror, not scoreboard (see: feedback_no_scores_mirror_not_scoreboard)
#   - Contradictions use user's own words (see: feedback_contradiction_mirror_pattern)
#   - Override is always available (see: feedback_owner_override_absolute)
#
# Bias categories drawn from perceptual, cognitive, emotional, social, and meta-level domains.

# ── Drive-Level Susceptibility Rules ────────────────────────────────────
# These are the base rules. A profile's fingerprint is the UNION of its drive-level biases.

drive_rules:
  dominance:
    high:  # D >= 7
      - id: overconfidence
        domain: cognitive
        description: "More certain about knowledge and predictions than accuracy justifies"
        observation_template: "You committed to {decision} without checking {unchecked_assumption}"
      - id: cognitive_dissonance_reduction
        domain: emotional
        description: "When beliefs and actions conflict, changes the story rather than the behavior"
        observation_template: "You said '{past_statement}' on {date}. Today you're doing the opposite."
      - id: anchoring
        domain: cognitive
        description: "First number or idea heavily influences later judgments"
        observation_template: "The first number in this conversation was {anchor}. Everything since has been relative to it."
      - id: authority_resistance
        domain: social
        description: "Dismisses input from perceived authority as constraint rather than signal"
        observation_template: "{person} flagged {concern}. You moved past it without engaging."
    low:  # D <= 3
      - id: authority_deference
        domain: social
        description: "Overweights opinions from perceived authority figures"
        observation_template: "You changed direction after {authority_figure} suggested it. Was that your call or theirs?"
      - id: consensus_seeking
        domain: social
        description: "Defaults to group agreement over independent judgment"
        observation_template: "You've agreed with the last {count} suggestions without pushback."
      - id: conflict_avoidance
        domain: emotional
        description: "Avoids necessary confrontation to preserve harmony"
        observation_template: "You mentioned being uncomfortable with {issue} but haven't raised it."

  extraversion:
    high:  # E >= 7
      - id: halo_effect
        domain: social
        description: "One salient positive trait colors the whole impression of a person"
        observation_template: "You've mentioned {person}'s {trait} {count} times. What don't you know about them yet?"
      - id: optimism_bias
        domain: emotional
        description: "Expects more good outcomes than is realistic"
        observation_template: "You're planning for the best case. What happens if {risk_factor}?"
      - id: social_proof
        domain: social
        description: "Assumes something is right because many others do it"
        observation_template: "You cited {count} people doing this. How many tried and failed?"
      - id: activity_as_progress
        domain: meta
        description: "Mistakes busyness for meaningful advancement"
        observation_template: "You've touched {count} things today. Which one actually moved forward?"
    low:  # E <= 3
      - id: knowledge_hoarding
        domain: social
        description: "Holds information rather than sharing, creating silos"
        observation_template: "You figured out {insight} last week but haven't shared it with {relevant_person}."
      - id: under_communication
        domain: social
        description: "Assumes others understand context they don't have"
        observation_template: "You made a decision about {topic} without telling {stakeholder}."
      - id: isolation_bias
        domain: social
        description: "Prefers solo analysis over collaborative sense-making"
        observation_template: "You've been working on {topic} alone for {duration}. Who else has seen it?"

  patience:
    low:  # C <= 3
      - id: present_bias
        domain: meta
        description: "Overvalues immediate rewards vs long-term outcomes"
        observation_template: "You were working on {long_term_goal}. You've been on {shiny_thing} for {duration} instead."
      - id: selective_attention
        domain: perceptual
        description: "Hyperfocuses on current interest, missing other signals"
        observation_template: "While you've been deep in {focus_area}, {missed_signal} happened."
      - id: sunk_cost_people
        domain: cognitive
        description: "Holds onto people relationships past their productive life"
        observation_template: "You've been waiting on {person} for {duration}. What's changed since last check-in?"
      - id: speed_over_rigor
        domain: meta
        description: "Prioritizes velocity at expense of validation"
        observation_template: "You shipped {thing} without {validation_step}."
    high:  # C >= 7
      - id: analysis_paralysis
        domain: cognitive
        description: "Over-analyzes before acting, missing timing windows"
        observation_template: "You've been evaluating {decision} for {duration}. What's the cost of waiting longer?"
      - id: change_resistance
        domain: meta
        description: "Prefers status quo even when change is warranted"
        observation_template: "You've flagged {issue} three times but haven't changed anything."
      - id: risk_aversion
        domain: emotional
        description: "Avoids necessary risks to maintain stability"
        observation_template: "The safe path is {safe_option}. You haven't considered {risky_but_better_option}."

  formality:
    low:  # F <= 3
      - id: framing_effects
        domain: cognitive
        description: "Relies on narrative framing over structured analysis"
        observation_template: "You described {decision} as a story. What does the data say?"
      - id: survivorship_bias
        domain: meta
        description: "Reasons from visible successes, ignoring hidden failures"
        observation_template: "You referenced {success_example}. How many tried the same approach and failed?"
      - id: process_dismissal
        domain: meta
        description: "Bypasses documentation and process as unnecessary friction"
        observation_template: "You skipped {process_step} on {task}. Last time that caused {consequence}."
    high:  # F >= 7
      - id: process_rigidity
        domain: meta
        description: "Follows process even when it's counterproductive"
        observation_template: "You're following {process} by the book. The situation calls for {adaptation}."
      - id: perfectionism
        domain: emotional
        description: "Delays delivery pursuing unnecessary precision"
        observation_template: "This has been in review for {duration}. What's the gap between 'good enough' and 'perfect' here?"
      - id: over_compliance
        domain: social
        description: "Treats guidelines as rules even when exceptions are warranted"
        observation_template: "The guideline says {rule}. This situation is an exception because {reason}."


# ── Per-Profile Bias Fingerprints ───────────────────────────────────────
# Derived from drive rules above, plus profile-specific behavioral patterns.
# primary: top 3 biases most likely to manifest daily
# secondary: biases that emerge under stress or in specific contexts
# strength: natural resistance to certain biases (the flip side of drives)

profiles:
  maverick:
    drives: { D: 10, E: 8, C: 1, F: 1 }
    primary:
      - cognitive_dissonance_reduction
      - selective_attention
      - optimism_bias
    secondary:
      - halo_effect
      - overconfidence
      - framing_effects
      - present_bias
      - sunk_cost_people
      - survivorship_bias
      - anchoring
    strengths:
      - analysis_paralysis_immune
      - change_resistance_immune
      - authority_deference_immune
      - process_rigidity_immune

