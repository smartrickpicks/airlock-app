# LiteLLM Gateway Configuration
# Model routing for Otto AI agent — provider-agnostic LLM access
#
# Model aliases:
#   otto-default  — Primary reasoning model (Claude Sonnet, GPT-4o fallback)
#   otto-fast     — Quick responses, lower cost (Claude Haiku)
#   otto-local    — Local dev without API keys (Ollama)
#
# Env vars required:
#   ANTHROPIC_API_KEY  — Claude API key (production)
#   OPENAI_API_KEY     — GPT fallback key (optional)
#   LITELLM_MASTER_KEY — LiteLLM admin key

model_list:
  # Primary model — Claude Sonnet (best reasoning + tool use)
  - model_name: otto-default
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096

  # Fallback model — GPT-4o (when Claude is unavailable)
  - model_name: otto-default
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096

  # Fast model — Claude Haiku (quick responses, lower cost)
  - model_name: otto-fast
    litellm_params:
      model: anthropic/claude-haiku-4-20250414
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 2048

  # Local dev model — Ollama (no API keys needed, air-gapped)
  - model_name: otto-local
    litellm_params:
      model: ollama/llama3.1
      api_base: http://ollama:11434

router_settings:
  routing_strategy: simple-shuffle # Tries models in order, auto-failover
  num_retries: 2 # Retry on transient failures
  timeout: 30 # Per-request timeout (seconds)
  fallbacks:
    - otto-default: [otto-fast] # If default fails, try fast model
